<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="ConnectMe Scanner — Scan kartu nama untuk melihat profil AR 3D.">
  <meta name="theme-color" content="#050510">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Scan — ConnectMe</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">

  <!-- A-Frame (loaded BEFORE MindAR) -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- MindAR Image Tracking (A-Frame extension) -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <!-- jsQR (lightweight QR decoder) -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scanner Wrapper (fullscreen) -->
  <div class="scanner-wrapper">

    <!-- ================================
         PHASE 1: QR Code Detection
         ================================ -->
    <div id="qr-phase" class="qr-phase">
      <!-- Live camera feed -->
      <video id="qr-video" playsinline autoplay muted></video>

      <!-- Scan overlay with frame guide -->
      <div class="scan-overlay">
        <div id="scan-frame" class="scan-frame">
          <span class="corner-bl"></span>
          <span class="corner-br"></span>
          <div class="scan-line"></div>
        </div>
        <p id="scan-hint" class="scan-hint">📸 Arahkan kamera ke QR Code kartu nama</p>
        <button id="btn-skip-qr" class="skip-qr-btn">🚀 Lewati QR → Langsung AR</button>
      </div>
    </div>

    <!-- ================================
         PHASE 2: AR Scene (MindAR)
         ================================ -->
    <div id="ar-phase" class="ar-phase">
      <!-- MindAR a-scene will be injected here dynamically -->
    </div>

    <!-- ================================
         Shared UI Overlays
         ================================ -->

    <!-- Back button -->
    <div class="nav-back">
      <a href="index.html" class="back-btn" id="btn-back">← Kembali</a>
    </div>

    <!-- Status badge -->
    <div id="status-badge" class="status-badge">
      <span class="status-dot"></span>
      <span id="status-text">Mencari QR...</span>
    </div>

    <!-- AR Info Card (bottom sheet) -->
    <div id="ar-info-card" class="ar-info-card">
      <div class="card-header">
        <div class="card-avatar" id="card-avatar">👤</div>
        <div>
          <div class="card-name" id="card-name">—</div>
          <div class="card-title" id="card-title">—</div>
        </div>
      </div>
      <div class="card-details" id="card-details">
        <!-- Filled dynamically -->
      </div>
      <div class="social-bar" id="social-bar">
        <!-- Filled dynamically -->
      </div>
    </div>

    <!-- Camera Error Screen -->
    <div id="camera-error" class="camera-error">
      <div class="error-icon">📵</div>
      <h2>Kamera Tidak Tersedia</h2>
      <p>Izin akses kamera ditolak atau tidak ada kamera yang terdeteksi. Pastikan Anda menggunakan HTTPS.</p>
      <a href="index.html" class="btn btn-primary">← Kembali ke Home</a>
    </div>

  </div>

  <!-- App Logic -->
  <script type="module">
    import { QRDetector } from './js/qr-detect.js';
    import { ARScene } from './js/ar-scene.js';

    class ScannerApp {
      constructor() {
        // DOM elements
        this.qrPhase = document.getElementById('qr-phase');
        this.arPhase = document.getElementById('ar-phase');
        this.qrVideo = document.getElementById('qr-video');
        this.scanFrame = document.getElementById('scan-frame');
        this.scanHint = document.getElementById('scan-hint');
        this.statusBadge = document.getElementById('status-badge');
        this.statusText = document.getElementById('status-text');
        this.arInfoCard = document.getElementById('ar-info-card');
        this.cameraError = document.getElementById('camera-error');
        this.toastContainer = document.getElementById('toast-container');

        this.qrDetector = null;
        this.arScene = null;
        this.currentPhase = 'qr'; // 'qr' or 'ar'

        this.init();
      }

      init() {
        // Phase 1: Start QR detection
        this.qrDetector = new QRDetector({
          videoEl: this.qrVideo,
          onDetected: (data) => this.onQRDetected(data),
          onError: (err) => this.onCameraError(err),
        });

        this.qrDetector.start();

        // Skip QR button
        const skipBtn = document.getElementById('btn-skip-qr');
        skipBtn.addEventListener('click', () => this.skipToAR());

        console.log('✨ Scanner App Initialized');
      }

      skipToAR() {
        // Use default profile data and skip straight to AR
        const defaultProfile = {
          name: 'Farrel Berwyn',
          title: 'Software Developer',
          company: 'ConnectMe',
          email: 'farrel@connectme.dev',
          phone: '+62 812 3456 7890',
          website: 'https://farrelberwyn.github.io/ConnectMe/',
          linkedin: 'https://linkedin.com/in/farrelberwyn',
          instagram: 'https://instagram.com/farrelberwyn',
          github: 'https://github.com/FarrelBerwyn',
          color: '#7B6CF6',
        };
        this.showToast('success', 'Memuat AR mode...');
        this.transitionToAR(defaultProfile);
      }

      onQRDetected(data) {
        // Visual feedback: detected!
        this.scanFrame.classList.add('detected');
        this.scanHint.textContent = '✅ QR Terdeteksi! Memuat AR...';
        this.statusText.textContent = 'QR Terdeteksi';
        this.showToast('success', `QR Terdeteksi: ${data.name}`);

        // Wait a beat for visual feedback, then transition to AR
        setTimeout(() => {
          this.transitionToAR(data);
        }, 800);
      }

      transitionToAR(profileData) {
        // Hide camera error overlay (in case it was shown)
        this.cameraError.classList.remove('visible');

        // Stop QR detector & release camera hardware
        this.qrDetector.stop();
        this.qrPhase.style.display = 'none';

        // Show AR phase
        this.arPhase.classList.add('active');
        this.currentPhase = 'ar';

        // Update status
        this.statusText.textContent = 'Memuat AR...';

        // Wait for camera hardware to fully release before MindAR requests it
        setTimeout(() => {
          this.arScene = new ARScene({
            containerEl: this.arPhase,
            onTrackingFound: () => this.onTrackingFound(),
            onTrackingLost: () => this.onTrackingLost(),
          });
          this.arScene.start(profileData);

          // Show info card
          this.populateInfoCard(profileData);

          // Update status after MindAR scene is injected
          this.statusText.textContent = 'Cari Kartu Nama...';
        }, 1000);
      }

      onTrackingFound() {
        this.statusBadge.classList.add('tracking');
        this.statusText.textContent = 'Tracking Aktif';
        this.arInfoCard.classList.add('visible');
      }

      onTrackingLost() {
        this.statusBadge.classList.remove('tracking');
        this.statusText.textContent = 'Cari Kartu Nama...';
        // Keep info card visible for UX
      }

      populateInfoCard(data) {
        document.getElementById('card-name').textContent = data.name;
        document.getElementById('card-title').textContent = [data.title, data.company].filter(Boolean).join(' • ');

        // Details
        const detailsEl = document.getElementById('card-details');
        detailsEl.innerHTML = '';
        const details = [];
        if (data.email) details.push({ icon: '✉️', text: data.email });
        if (data.phone) details.push({ icon: '📱', text: data.phone });
        if (data.website) details.push({ icon: '🌐', text: data.website });

        details.forEach(d => {
          const row = document.createElement('div');
          row.className = 'card-detail-row';
          row.innerHTML = `<span class="detail-icon">${d.icon}</span><span>${d.text}</span>`;
          detailsEl.appendChild(row);
        });

        // Social bar
        const socialBar = document.getElementById('social-bar');
        socialBar.innerHTML = '';
        const socials = [];
        if (data.linkedin) socials.push({ label: 'LinkedIn', url: data.linkedin, svg: '<svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>' });
        if (data.instagram) socials.push({ label: 'Instagram', url: data.instagram, svg: '<svg viewBox="0 0 24 24"><path d="M12 0C8.74 0 8.333.015 7.053.072 5.775.132 4.905.333 4.14.63c-.789.306-1.459.717-2.126 1.384S.935 3.35.63 4.14C.333 4.905.131 5.775.072 7.053.012 8.333 0 8.74 0 12s.015 3.667.072 4.947c.06 1.277.261 2.148.558 2.913.306.788.717 1.459 1.384 2.126.667.666 1.336 1.079 2.126 1.384.766.296 1.636.499 2.913.558C8.333 23.988 8.74 24 12 24s3.667-.015 4.947-.072c1.277-.06 2.148-.262 2.913-.558.788-.306 1.459-.718 2.126-1.384.666-.667 1.079-1.335 1.384-2.126.296-.765.499-1.636.558-2.913.06-1.28.072-1.687.072-4.947s-.015-3.667-.072-4.947c-.06-1.277-.262-2.149-.558-2.913-.306-.789-.718-1.459-1.384-2.126C21.319 1.347 20.651.935 19.86.63c-.765-.297-1.636-.499-2.913-.558C15.667.012 15.26 0 12 0zm0 2.16c3.203 0 3.585.016 4.85.071 1.17.055 1.805.249 2.227.415.562.217.96.477 1.382.896.419.42.679.819.896 1.381.164.422.36 1.057.413 2.227.057 1.266.07 1.646.07 4.85s-.015 3.585-.074 4.85c-.061 1.17-.256 1.805-.421 2.227-.224.562-.479.96-.899 1.382-.419.419-.824.679-1.38.896-.42.164-1.065.36-2.235.413-1.274.057-1.649.07-4.859.07-3.211 0-3.586-.015-4.859-.074-1.171-.061-1.816-.256-2.236-.421-.569-.224-.96-.479-1.379-.899-.421-.419-.69-.824-.9-1.38-.165-.42-.359-1.065-.42-2.235-.045-1.26-.061-1.649-.061-4.844 0-3.196.016-3.586.061-4.861.061-1.17.255-1.814.42-2.234.21-.57.479-.96.9-1.381.419-.419.81-.689 1.379-.898.42-.166 1.051-.361 2.221-.421 1.275-.045 1.65-.06 4.859-.06l.045.03zm0 3.678a6.162 6.162 0 100 12.324 6.162 6.162 0 100-12.324zM12 16c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4zm7.846-10.405a1.441 1.441 0 11-2.88 0 1.441 1.441 0 012.88 0z"/></svg>' });
        if (data.github) socials.push({ label: 'GitHub', url: data.github, svg: '<svg viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>' });
        if (data.email) socials.push({ label: 'Email', url: `mailto:${data.email}`, svg: '<svg viewBox="0 0 24 24"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 010 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/></svg>' });

        socials.forEach(s => {
          const link = document.createElement('a');
          link.href = s.url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.className = 'social-link';
          link.title = s.label;
          link.innerHTML = s.svg;
          socialBar.appendChild(link);
        });

        // Show info card after a brief delay
        setTimeout(() => {
          this.arInfoCard.classList.add('visible');
        }, 500);
      }

      onCameraError(err) {
        console.error('Camera error:', err);
        this.cameraError.classList.add('visible');
      }

      showToast(type, message, duration = 3000) {
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.innerHTML = `
          <span class="toast-icon">${type === 'success' ? '✅' : '❌'}</span>
          <span class="toast-message">${message}</span>
        `;
        this.toastContainer.appendChild(toast);
        setTimeout(() => {
          toast.classList.add('toast-out');
          setTimeout(() => toast.remove(), 300);
        }, duration);
      }
    }

    // Start on DOM ready
    document.addEventListener('DOMContentLoaded', () => {
      window.scannerApp = new ScannerApp();
    });
  </script>
</body>
</html>
